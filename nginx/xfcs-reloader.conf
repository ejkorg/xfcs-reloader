upstream xfcs_reloader {
    server usaz15ls088:8005;
    keepalive 64;
}

# Keep this only if frontend auth still uses /resender/api/auth
upstream resender_backend {
    server usaz15ls088:8004;
    keepalive 64;
}

server {
    listen 80;
    server_name your-domain.com;

    # --- Static assets (long cache) ---
    location ^~ /xfcs-reloader/assets/ {
        alias /export/home/dpower/nginx/html/xfcs-reloader/assets/;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # --- XFCS API proxy ---
    location /xfcs-reloader/api/ {
        proxy_pass http://xfcs_reloader;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /xfcs-reloader;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- Optional: auth endpoint passthrough if frontend uses /resender/api/auth ---
    location /resender/api/ {
        proxy_pass http://resender_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    # --- XFCS SPA route ---
    location ^~ /xfcs-reloader/ {
        alias /export/home/dpower/nginx/html/xfcs-reloader/;
        index index.html;
        try_files $uri $uri/ /xfcs-reloader/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
    }
}
