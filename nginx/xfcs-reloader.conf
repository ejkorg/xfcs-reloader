# 2026-01-06: Consolidated nginx configuration for Exensio Dearchiver
worker_processes auto;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  # access_log  /export/home/dpower/nginx/logs/access.log;
  # error_log   /export/home/dpower/nginx/logs/error.log warn;
  # Using standard paths for validity testing, uncomment above for production if paths exist
  access_log  logs/access.log;
  error_log   logs/error.log warn;

  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;

  keepalive_timeout 65;
  keepalive_requests 1000;

  server_tokens off;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 256;
  gzip_vary on;
  gzip_proxied any;
  gzip_types
    text/plain text/css text/javascript application/javascript application/x-javascript
    application/json application/xml application/xml+rss image/svg+xml;

  # ---------------------------------------------------------------------------
  # Upstream Definitions
  # ---------------------------------------------------------------------------
  upstream jnd-lot-metadata {
    server usaz15ls088:8000;
    keepalive 64;
  }

  upstream pipeline-service {
    server 127.0.0.1:8001;
    keepalive 64;
  }

  upstream historical-loading {
    server usaz15ls088:5000;
    keepalive 64;
  }

  # [NEW] Exensio Dearchiver Backend
  upstream exensio-dearchiver {
    server usaz15ls088:8003;
    keepalive 64;
  }

  upstream exensioreload_backend {
    server usaz15ls088:8004;
    keepalive 64;
  }

  upstream xfcs_reloader {
    server usaz15ls088:8005;
    keepalive 64;
  }

  upstream dploadmgr_backend {
    server usaz15ls088:8006;
    keepalive 64;
  }

  upstream stdf_backend {
    server 127.0.0.1:3000;
  }


  server {
    listen 8080 ssl;
    server_name usaz15ls088;

    # SSL Certificate Configuration (replace with actual paths to your certificates)
    ssl_certificate     /export/home/dpower/nginx/ssl/usaz15ls088.crt;
    ssl_certificate_key /export/home/dpower/nginx/ssl/usaz15ls088.key;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Automatically redirect plain HTTP requests to HTTPS on the same port
    error_page 497 https://$host:8080$request_uri;

    root /export/home/dpower/nginx/html;

    # -------------------------------------------------------------------------
    # Existing Locations
    # -------------------------------------------------------------------------
    
    location ^~ /pipeline-dashboard/assets/ {
      alias /export/home/dpower/nginx/html/pipeline-dashboard/assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location ^~ /pipeline-dashboard/ {
      alias /export/home/dpower/nginx/html/pipeline-dashboard/;
      index index.html;
      try_files $uri $uri/ /pipeline-dashboard/index.html;
    }

    location = /pipeline-dashboard/index.html {
      alias /export/home/dpower/nginx/html/pipeline-dashboard/index.html;
      expires -1;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    location /jnd-lot-metadata/ {
      proxy_pass http://jnd-lot-metadata/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /jnd-lot-metadata;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    location /pipeline-service/ {
      proxy_pass http://pipeline-service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /pipeline-service;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
      proxy_redirect off;
    }

    location /historical-loading/ {
      proxy_pass http://historical-loading/;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /historical-loading;
      proxy_connect_timeout 5s;
      proxy_send_timeout 30s;
      proxy_read_timeout 30s;
    }

    # --- Safe WebAuthn stub ---
    location = /webauthnInterceptor.js {
      default_type application/javascript;
      return 200 "(function(){try{if(typeof navigator!=='undefined'){var c=navigator.credentials||{};if(typeof c.create!=='function')c.create=function(){return Promise.reject(new Error('WebAuthn not supported'));};if(typeof c.get!=='function')c.get=function(){return Promise.reject(new Error('WebAuthn not supported'));};navigator.credentials=c;}if(typeof window!=='undefined'&&typeof window.PublicKeyCredential==='undefined'){window.PublicKeyCredential=function(){};}}catch(e){}})();";
    }

    location ~* /webauthnInterceptor\.js$ {
      default_type application/javascript;
      return 200 "(function(){try{if(typeof navigator!=='undefined'){var c=navigator.credentials||{};if(typeof c.create!=='function')c.create=function(){return Promise.reject(new Error('WebAuthn not supported'));};if(typeof c.get!=='function')c.get=function(){return Promise.reject(new Error('WebAuthn not supported'));};navigator.credentials=c;}if(typeof window!=='undefined'&&typeof window.PublicKeyCredential==='undefined'){window.PublicKeyCredential=function(){};}}catch(e){}})();";
    }

    # --- Static assets (long cache) ---
    location ^~ /exensio-reload/assets/ {
      alias /export/home/dpower/nginx/html/exensio-reload/assets/; # adjust path
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # --- API proxy (recommended backend handles CORS) ---
    location /exensio-reload/api/ {
      proxy_pass http://exensioreload_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Ensure Authorization header is forwarded to the backend
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /exensio-reload;

      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;

      # Optional: if you want cookies scoped to the SPA path
      # proxy_cookie_path / /exensio-reload/;
    }

    # --- OAuth2 / SSO backend endpoints (must come before SPA catch-all) ---
    location ^~ /exensio-reload/oauth2/ {
      proxy_pass http://exensioreload_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /exensio-reload;
    }

    location ^~ /exensio-reload/login/oauth2/ {
      proxy_pass http://exensioreload_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /exensio-reload;
    }

    # --- SPA route ---
    location ^~ /exensio-reload/ {
      alias /export/home/dpower/nginx/html/exensio-reload/; # adjust path
      index index.html;
      try_files $uri $uri/ /exensio-reload/index.html;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://usaz15ls088 https://usaz15ls088:8080 http://usaz15ls088:8004 http://localhost:8080 http://localhost:8004 http://127.0.0.1:8080 http://127.0.0.1:8004; img-src 'self' data: blob:; script-src 'self' 'unsafe-hashes'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    # Security headers (adjust to taste)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # --- Static assets (long cache) ---
    location ^~ /xfcs-reloader/assets/ {
      alias /export/home/dpower/nginx/html/xfcs-reloader/assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # --- XFCS API proxy ---
    location /xfcs-reloader/api/ {
      proxy_pass http://xfcs_reloader;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /xfcs-reloader;

      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    # --- XFCS SPA route ---
    location ^~ /xfcs-reloader/ {
      alias /export/home/dpower/nginx/html/xfcs-reloader/;
      index index.html;

      # Serve static assets directly; return 404 for missing files instead of
      # falling back to index.html (which causes MIME type errors for .js/.mjs).
      location ~* \.(js|mjs|css|woff2?|ttf|eot|svg|ico|png|jpg|jpeg|gif|map|json)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
      }

      try_files $uri $uri/ /xfcs-reloader/index.html;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://usaz15ls088 https://usaz15ls088:8080 http://usaz15ls088:8005 http://localhost:8080 http://localhost:8005 http://127.0.0.1:8080 http://127.0.0.1:8005; img-src 'self' data: blob:; script-src 'self' 'unsafe-eval' 'unsafe-hashes'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    # -------------------------------------------------------------------------
    # dploadmgr
    # -------------------------------------------------------------------------

    location ^~ /dploadmgr/assets/ {
      alias /export/home/dpower/nginx/html/dploadmgr/assets/;
      access_log off;
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    location /dploadmgr/api/ {
      proxy_pass http://dploadmgr_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Port $server_port;
      proxy_set_header X-Forwarded-Prefix /dploadmgr;
      proxy_connect_timeout 300s;
      proxy_send_timeout 300s;
      proxy_read_timeout 300s;
    }

    location ^~ /dploadmgr/ {
      alias /export/home/dpower/nginx/html/dploadmgr/;
      index index.html;
      try_files $uri $uri/ /dploadmgr/index.html;
      add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://usaz15ls088 https://usaz15ls088:8080 http://usaz15ls088:8006 http://localhost:8080 http://localhost:8006 http://127.0.0.1:8080 http://127.0.0.1:8006; img-src 'self' data: blob:; script-src 'self' 'unsafe-hashes'; script-src-elem 'self'; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com" always;
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma "no-cache" always;
    }

    # -------------------------------------------------------------------------
    # Error Pages
    # -------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html { root /export/home/dpower/nginx/html; }

    location / {
      try_files $uri $uri/ =404;
    }

    # location /stdf-convert/ {
    #     # Proxy to the local Rust service running on port 3000
    #     proxy_pass http://127.0.0.1:3000/;

    #     # Essential for large file uploads - disable body size limit
    #     client_max_body_size 0; 
        
    #     # Essential for streaming - disable buffering
    #     proxy_buffering off;
    #     proxy_request_buffering off;
        
    #     # Standard Proxy Headers
    #     proxy_http_version 1.1;
    #     proxy_set_header Connection "";
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
        
    #     # Timeouts for large files
    #     proxy_connect_timeout 600s;
    #     proxy_send_timeout 600s;
    #     proxy_read_timeout 600s;
    # }

    location /stdf-convert-benchmark/ {
      # Proxy to the local Rust service via upstream
      proxy_pass http://stdf_backend/;

      # Essential for large file uploads - disable body size limit
      client_max_body_size 0; 
      
      # Essential for streaming - disable buffering
      proxy_buffering off;
      proxy_request_buffering off;
      
      # Standard Proxy Headers
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      
      # Timeouts for large files
      proxy_connect_timeout 600s;
      proxy_send_timeout 600s;
      proxy_read_timeout 600s;
    }

    location /exensio-integration-hub/ {
      # The physical path on your Linux server where you copied the dist/ folder
      alias /export/home/dpower/nginx/html/exensio-integration-hub/;
      
      # Ensure SPA routing falls back to index.html
      try_files $uri $uri/ /exensio-integration-hub/index.html;
      
      # Optional: Cache control for static assets (images, css, js)
      location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff2)$ {
        expires max;
        add_header Cache-Control "public, no-transform";
      }
    }

    # Security headers (adjust to taste)
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

  }
}
