[Unit]
Description=XFCS Reloader Backend Service
After=network.target

[Service]
Type=simple
User=dpower
WorkingDirectory=/export/home/dpower/jag/xfcs-reloader

Environment=JAVA_HOME=/apps/exensio/jdk-21.0.8+9
Environment=PATH=/apps/exensio/jdk-21.0.8+9/bin:/usr/local/bin:/usr/bin

# Spring profile — REQUIRED to use Oracle datasource and enable Liquibase
Environment="SPRING_PROFILES_ACTIVE=onsemi-oracle"

# Exensio configuration
Environment="EXENSIO_ENABLED=true"
Environment="EXENSIO_ENV=PROD"
Environment="EXENSIO_PROD_URL=https://api-prod.canyon.aws.pdf.com/api"
Environment="EXENSIO_USERNAME=YQS_API_USER"
Environment="EXENSIO_PASSWORD=xNsqy667p"

# Snowflake pre-check configuration (secondary datasource only)
Environment="SNOW_URL=jdbc:snowflake://onsemi.west-us-2.azure.snowflakecomputing.com/?db=ANALYTICSPRD&schema=MFG&warehouse=MFG_PRD_RPT_WH"
Environment="SNOW_USER=MFG_PRD_RPT_EXENSIO_USER"
Environment="SNOW_PASS=5)Day=323fFd"

# DO NOT SET (leave unset so Oracle profile datasource is used):
# - XFCS_DB_URL
# - XFCS_DB_USERNAME
# - XFCS_DB_PASSWORD

ExecStart=/apps/exensio/jdk-21.0.8+9/bin/java \
  -jar /export/home/dpower/jag/xfcs-reloader/xfcs-reloader-backend-1.0.0-SNAPSHOT.jar \
  --logging.file.name=/export/home/dpower/logs/xfcs-reloader.log

SuccessExitStatus=143
Restart=on-failure
RestartSec=5

[Install]
WantedBy=multi-user.target
