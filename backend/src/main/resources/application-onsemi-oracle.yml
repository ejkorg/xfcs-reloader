spring:
  datasource:
    url: jdbc:oracle:thin:@//exnqa-db.onsemi.com:1740/EXNQA.onsemi.com
    username: refdb
    password: "br#^gox66312sdAB"
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      jdbc-url: jdbc:oracle:thin:@//exnqa-db.onsemi.com:1740/EXNQA.onsemi.com
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${SPRING_MAIL_HOST:mailhost.onsemi.com}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

exensio:
  enabled: true
  env: ${EXENSIO_ENV:QA}
  # Base URL must NOT include /v1 — the client appends /v1/session/login itself.
  # Correct: https://api-prod.canyon.aws.pdf.com/api
  # Wrong:   https://api-prod.canyon.aws.pdf.com/api/v1/  ← causes double /v1/ and 303
  qa-url: ${EXENSIO_QA_URL:https://exnqa.onsemi.com/api}
  prod-url: ${EXENSIO_PROD_URL:https://api-prod.canyon.aws.pdf.com/api}
  username: ${EXENSIO_USERNAME:}
  password: ${EXENSIO_PASSWORD:}
  dbname: ${EXENSIO_DBNAME:}
  timeout-minutes: ${EXENSIO_TIMEOUT_MINUTES:60}
  poll-interval-ms: ${EXENSIO_POLL_INTERVAL_MS:60000}

xfcs:
  archives-root: /export/home/dpower/archives
  notification-email-enabled: ${XFCS_NOTIFICATION_EMAIL_ENABLED:true}
  notification-email-from: ${XFCS_NOTIFICATION_EMAIL_FROM:no-reply@onsemi.com}

  # Optional: if requester is not an email (e.g., "admin"), convert to admin@<domain>
  notification-email-requester-domain: ${XFCS_NOTIFICATION_EMAIL_REQUESTER_DOMAIN:onsemi.com}

  # Optional: comma-separated fallback recipients when requester email can't be resolved
  notification-email-fallback-recipients: ${XFCS_NOTIFICATION_EMAIL_FALLBACK_RECIPIENTS:}

  # Optional: email subject prefix and row cap
  notification-email-subject-prefix: ${XFCS_NOTIFICATION_EMAIL_SUBJECT_PREFIX:[XFCS Reloader]}
  notification-email-max-files: ${XFCS_NOTIFICATION_EMAIL_MAX_FILES:500}
