server:
  port: 8005
  servlet:
    context-path: /xfcs-reloader

spring:
  datasource:
    url: ${XFCS_DB_URL:jdbc:h2:mem:xfcs_reloader;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false}
    username: ${XFCS_DB_USERNAME:sa}
    password: ${XFCS_DB_PASSWORD:}
    driver-class-name: ${XFCS_DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:25}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SPRING_MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:false}

logging:
  level:
    root: INFO
    com.onsemi.cim.apps.exensio.xfcsreloader: INFO

security:
  allowed-origins: >
    http://localhost:4200,
    http://localhost:5173,
    http://localhost:8080,
    http://usaz15ls088:8080,
    http://usaz15ls088:8005,
    http://usaz15ls088

reloader:
  jwt:
    # Must match issuer service secret for shared-login compatibility.
    secret: ${RELOADER_JWT_SECRET:dev-secret-change-me-please-32-bytes}

sso:
  enabled: ${SSO_ENABLED:true}
  exensio-auth-url: ${SSO_EXENSIO_AUTH_URL:https://usaz15ls088:8080/exensio-reload/auth}
  callback-url: ${SSO_CALLBACK_URL:http://localhost:4200/sso-callback}

exensio:
  enabled: ${EXENSIO_ENABLED:false}
  env: ${EXENSIO_ENV:QA}
  qa-url: ${EXENSIO_QA_URL:}
  prod-url: ${EXENSIO_PROD_URL:}
  username: ${EXENSIO_USERNAME:}
  password: ${EXENSIO_PASSWORD:}
  dbname: ${EXENSIO_DBNAME:}
  dbschema: ${EXENSIO_DBSCHEMA:PRODUCTION}
  timeout-minutes: ${EXENSIO_TIMEOUT_MINUTES:60}
  poll-interval-ms: ${EXENSIO_POLL_INTERVAL_MS:60000}

xfcs:
  feature-enabled: ${XFCS_FEATURE_ENABLED:true}
  archives-root: ${XFCS_ARCHIVES_ROOT:/archives}
  search-max-results: ${XFCS_SEARCH_MAX_RESULTS:200}
  search-max-files-scan: ${XFCS_SEARCH_MAX_FILES_SCAN:20000}
  env-conf-cache-ttl-sec: ${XFCS_ENV_CONF_CACHE_TTL_SEC:120}
  env-conf-retries: ${XFCS_ENV_CONF_RETRIES:2}
  env-conf-retry-backoff-ms: ${XFCS_ENV_CONF_RETRY_BACKOFF_MS:500}
  remote-enabled: ${XFCS_REMOTE_ENABLED:false}
  remote-host: ${XFCS_REMOTE_HOST:usaz15ls082}
  remote-port: ${XFCS_REMOTE_PORT:22}
  remote-user: ${XFCS_REMOTE_USER:dpower}
  remote-env-conf-path: ${XFCS_REMOTE_ENV_CONF_PATH:/export/home/dpower/project/scripts/dearchive/env.conf}
  remote-private-key-path: ${XFCS_REMOTE_PRIVATE_KEY_PATH:}
  remote-password: ${XFCS_REMOTE_PASSWORD:5taRf1sh}
  remote-known-hosts-path: ${XFCS_REMOTE_KNOWN_HOSTS_PATH:/export/home/dpower/.ssh/known_hosts}
  remote-strict-host-key: ${XFCS_REMOTE_STRICT_HOST_KEY:false}
  remote-connect-timeout-ms: ${XFCS_REMOTE_CONNECT_TIMEOUT_MS:5000}
  remote-read-timeout-ms: ${XFCS_REMOTE_READ_TIMEOUT_MS:10000}
  # Reload staging & folder resolution
  data-root: ${XFCS_DATA_ROOT:/apps/exensio_data/data}
  staging-folder: ${XFCS_STAGING_FOLDER:dearchive}
  mgr-file-path: ${XFCS_MGR_FILE_PATH:/export/home/dpower/project/load/fcs_all_load.mgr}
  pending-monitor-interval-sec: ${XFCS_PENDING_MONITOR_INTERVAL_SEC:5}
  pending-monitor-interval-ms: ${XFCS_PENDING_MONITOR_INTERVAL_MS:5000}
  stuck-session-timeout-min: ${XFCS_STUCK_SESSION_TIMEOUT_MIN:60}
  # Read mode for .mgr and .cfg files: LOCAL or REMOTE (via SSH)
  # The .mgr file lives on usaz15ls082 at /export/home/dpower/project/load/
  # Set to REMOTE so the app reads it via SSH, same as the old backend.
  mgr-read-mode: ${XFCS_MGR_READ_MODE:REMOTE}
  cfg-read-mode: ${XFCS_CFG_READ_MODE:REMOTE}
  dpload-env-var: ${XFCS_DPLOAD_ENV_VAR:DPLOAD}
  dpdata-env-var: ${XFCS_DPDATA_ENV_VAR:DPDATA}
  dpscript-env-var: ${XFCS_DPSCRIPT_ENV_VAR:DPSCRIPT}
  dplog-env-var: ${XFCS_DPLOG_ENV_VAR:DPLOG}
  # Completion email notification (sent once per terminal session)
  notification-email-enabled: ${XFCS_NOTIFICATION_EMAIL_ENABLED:false}
  notification-email-from: ${XFCS_NOTIFICATION_EMAIL_FROM:no-reply@localhost}
  # If requester is not an email, optionally map requester->requester@domain
  notification-email-requester-domain: ${XFCS_NOTIFICATION_EMAIL_REQUESTER_DOMAIN:}
  # Fallback recipients (comma-separated) used when requester email cannot be resolved
  notification-email-fallback-recipients: ${XFCS_NOTIFICATION_EMAIL_FALLBACK_RECIPIENTS:}
  notification-email-subject-prefix: ${XFCS_NOTIFICATION_EMAIL_SUBJECT_PREFIX:[XFCS Reloader]}
  notification-email-max-files: ${XFCS_NOTIFICATION_EMAIL_MAX_FILES:500}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
